<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181E2B" />
      <stop offset="50%" stop-color="#0F1219" />
      <stop offset="100%" stop-color="#080A0E" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.85"/>
  
  <!-- Subtle inner circle accent -->
  <circle cx="256" cy="240" r="160" fill="#6366F1" opacity="0.06"/>

  <!-- Main Kanji: 語 -->
  <text x="256" y="305" font-size="220" font-family="'Zen Kaku Gothic New', 'Noto Sans JP', 'Hiragino Sans', sans-serif" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" filter="url(#glow)">語</text>

  <!-- Subtitle: JLPT KOTOBA MASTER -->
  <text x="256" y="410" font-size="28" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" fill="#E2E8F0" letter-spacing="6" text-anchor="middle" opacity="0.95">JLPT MASTER</text>
</svg>